<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Screens</title>
    <style>
        body { background-color: #f4f6f8; font-family: 'Segoe UI', sans-serif; padding: 20px; margin: 0; }
        h1 { text-align: center; color: #2c3e50; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
        }

        .image-card {
            background: white;
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .image-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        .id-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 2px 8px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 13px;
        }

        .date-badge {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <h1>Screens</h1>
    <div class="gallery-grid" id="gallery-container">
        {% for img in images %}
            <div class="image-card" id="img-{{ img.id }}">
                <img src="{{ img.image.url }}">
                <span class="id-badge">#{{ img.id }}</span>
                <span class="date-badge">{{ img.created_at|date:"d.m.Y H:i" }}</span>
            </div>
        {% endfor %}
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        const socket = new WebSocket(protocol + '://' + window.location.host + '/ws/gallery/');

        socket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            const container = document.getElementById('gallery-container');

            // 1. O'chirish holati
            if (data.action === 'delete') {
                const el = document.getElementById('img-' + data.id);
                if (el) el.remove();
            }
            // 2. Yangilash (update) holati
            else if (data.action === 'update') {
                const imgEl = document.querySelector('#img-' + data.id + ' img');
                if (imgEl) {
                    imgEl.src = data.image_url + '?t=' + new Date().getTime();
                }
            }
            // 3. Yangi qo'shish (create) holati
            else {
                const div = document.createElement('div');
                div.className = 'image-card';
                div.id = 'img-' + data.id;

                const now = new Date();
                const dateStr = now.toLocaleDateString('uz-UZ') + ' ' + now.toLocaleTimeString('uz-UZ', {hour: '2-digit', minute:'2-digit'});

                div.innerHTML = `
                    <img src="${data.image_url}">
                    <span class="id-badge">#${data.id}</span>
                    <span class="date-badge">${dateStr}</span>
                `;
                container.insertBefore(div, container.firstChild);
            }
        };
    </script>
</body>
</html>
